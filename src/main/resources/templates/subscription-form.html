
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Form | SubTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .form-page { max-width: 760px; margin: 0 auto; }
        .form-panel { background: white; border: 1px solid #ececf4;
            border-radius: 18px; padding: 30px; }
        .form-label { font-size: 12px; font-weight: 700; color: #555970; }
        .form-control, .form-select { padding: 12px 13px; border-color: #e7e7f0;
            border-radius: 9px; font-size: 13px; }
        .form-control:focus, .form-select:focus {
            border-color: #8879ef; box-shadow: 0 0 0 3px #6758e81a;
        }
        .form-intro { color: #85899d; font-size: 12px; }
        .form-heading { font-weight: 800; letter-spacing: -0.5px; }
        .form-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:24px; }
        .btn-secondary-custom { border:1px solid #e7e7f0; border-radius:10px;
            padding:12px 17px; color:#555970; font-size:12px;
            font-weight:700; }
        .btn-secondary-custom:hover { background:#f7f7fb; }
        .form-check-input:checked { background-color:#6758e8; border-color:#6758e8; }
    </style>
</head>
<body>
<div class="main-content">
    <div class="form-page">
        <a th:href="@{/subscriptions}" class="brand mb-4">
            <span class="brand-icon"><i class="bi bi-layers-half"></i></span>
            <span>SubTrack<span class="brand-dot">.</span></span>
        </a>

        <div class="mb-4">
            <p class="eyebrow">SUBSCRIPTION MANAGEMENT</p>
            <h1 class="form-heading">Add a subscription</h1>
            <p class="form-intro">Enter your subscription details to keep track of recurring expenses.</p>
        </div>

        <div class="form-panel">
            <form th:action="@{/subscriptions/save}"
                  th:object="${subscription}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-4">
                    <label class="form-label" for="name">Subscription name</label>
                    <input id="name" class="form-control" type="text"
                           th:field="*{name}" placeholder="e.g. Netflix, Spotify"
                           required>
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}"></div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="cost">Amount (₹)</label>
                        <input id="cost" class="form-control" type="number"
                               th:field="*{cost}" min="0.01" step="0.01"
                               placeholder="199.00" required>
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('cost')}"
                             th:errors="*{cost}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="billingCycle">Billing cycle</label>
                        <select id="billingCycle" class="form-select"
                                th:field="*{billingCycle}" required>
                            <option value="">Select cycle</option>
                            <option value="Weekly">Weekly</option>
                            <option value="Monthly">Monthly</option>
                            <option value="Quarterly">Quarterly</option>
                            <option value="Yearly">Yearly</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="renewalDate">Next renewal date</label>
                    <input id="renewalDate" class="form-control" type="date"
                           th:field="*{renewalDate}" required>
                </div>

                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox"
                           role="switch" id="active" th:field="*{active}">
                    <label class="form-check-label form-label" for="active">
                        Subscription is active
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="bi bi-check2-circle"></i> Save Subscription
                    </button>
                    <a th:href="@{/subscriptions}" class="btn btn-secondary-custom">
                        Cancel
                    </a>
                </div>
            </form>
        </div>

        <p class="form-intro mt-4 text-center">
            SubTrack · Manage your recurring expenses with ease
        </p>
    </div>
</div>
</body>
</html>
