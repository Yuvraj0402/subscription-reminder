<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SubTrack</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; padding: 20px;
            display: grid; place-items: center; font-family: Arial, sans-serif;
            background: radial-gradient(circle at top left, #172554, #080d1c 55%);
            color: #f8fafc;
        }
        .auth-card {
            width: 100%; max-width: 420px; padding: 36px;
            background: #0f172af0; border: 1px solid #273449;
            border-radius: 22px; box-shadow: 0 25px 70px #0006;
        }
        .logo { font-size: 28px; font-weight: 800; color: #60a5fa; }
        .subtitle { color: #94a3b8; line-height: 1.6; margin-bottom: 26px; }
        label { display: block; margin: 17px 0 8px; color: #cbd5e1; }
        input {
            width: 100%; padding: 13px; border-radius: 10px;
            border: 1px solid #334155; background: #0b1220;
            color: white; font-size: 15px; outline: none;
        }
        input:focus { border-color: #60a5fa; }
        button {
            width: 100%; padding: 14px; margin-top: 24px; border: 0;
            border-radius: 10px; background: #3b82f6; color: white;
            font-size: 15px; font-weight: 700; cursor: pointer;
        }
        button:hover { background: #2563eb; }
        button:disabled { opacity: .6; cursor: wait; }
        .switch { text-align: center; color: #94a3b8; margin-top: 22px; }
        a { color: #60a5fa; text-decoration: none; }
        #message { margin-top: 16px; color: #fca5a5; font-size: 14px; }
    </style>
</head>
<body>
<main class="auth-card">
    <div class="logo">SubTrack.</div>
    <h1>Create your account</h1>
    <p class="subtitle">Keep all your subscriptions organized in one place.</p>

    <form id="signupForm">
        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="Your name" required autocomplete="name">

        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" required autocomplete="email">

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">

        <button id="signupButton" type="submit">Create account</button>
        <p id="message" role="alert"></p>
    </form>

    <p class="switch">Already registered? <a href="/login.html">Sign in</a></p>
</main>

<script type="module" src="/js/signup.js"></script>
</body>
</html>
